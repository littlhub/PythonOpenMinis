[project]
name = "openminis"
version = "1.0.1"
description = "OpenMinis — your private, on-device AI agent. Python port of the Kotlin/Android client."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }

# Kotlin sources: ../src/android/app/src/main/java/com/openminis/app/<module>
# Python mirror:  src/openminis/<module>
dependencies = [
    # --- core ---
    "pydantic>=2.7",
    "httpx>=0.27",
    "anyio>=4.4",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "keyring>=25.0",
    "cryptography>=42.0",
    # --- cli / tui ---
    "typer>=0.12",
    "annotated-doc>=0.0.5",  # typer 0.16+ runtime dep; uv sometimes misses it
    "rich>=13.7",
    "textual>=0.60",
    # --- server ---
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    # --- image (read_image 的缩放/重编码; 缺失时 read_image 直接报错) ---
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml",
]

[project.scripts]
minis = "openminis.cli.main:app"
minis-tui = "openminis.tui.app:main"
minis-server = "openminis.server.main:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openminis"]

# ---------------------------------------------------------------------------
# uv
# ---------------------------------------------------------------------------
[tool.uv]
default-groups = ["dev"]
package = true

# ---------------------------------------------------------------------------
# ruff — keep the port readable, not pedantic
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # long lines: we keep the original Kotlin comments verbatim
    "B008",   # function call in default arg (typer/Annotated idiom)
    "B904",   # raise ... from — too noisy across 20k lines of ported code
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

# ---------------------------------------------------------------------------
# mypy — pragmatic for a large mechanical port
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
